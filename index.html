<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luminar Videos</title>
<style>
  /* CapCut 9.x desktop look: neutral dark, one cyan accent, 12px UI, 4px radii, dense */
  :root { --bg:#1b1b1f; --panel:#232329; --panel2:#2c2c34; --line:#2e2e35; --fg:#e8e8ea; --muted:#8c8c94; --accent:#00d1c1;
          --aclip:#355270; --tclip:#8a6420; --head:120px; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:12px/1.4 system-ui, "Segoe UI", sans-serif; display:grid;
         grid-template-rows:40px 1fr 300px; overflow:hidden; }
  body.busy { cursor:progress; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:3px 9px; cursor:pointer; line-height:18px; }
  button:hover { border-color:#4a4a55; background:#33333c; }
  button.primary { background:var(--accent); color:#062b28; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#1fe0d0; }
  button.ghost { background:none; border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  select, input[type=number], input[type=text], textarea { background:#1a1a1e; border:1px solid var(--line); border-radius:4px; padding:3px 6px; }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  input[type=number] { width:64px; }
  input[type=range] { accent-color:var(--accent); height:14px; margin:0; min-width:0; }
  input[type=color] { width:26px; height:22px; padding:0; border:1px solid var(--line); background:none; border-radius:4px; }
  textarea { width:100%; min-height:56px; resize:vertical; }
  svg { display:block; }
  .ib { width:26px; height:26px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:none; border:0; border-radius:4px; color:#c9c9cf; }
  .ib:hover { background:var(--panel2); color:#fff; }
  .ib.on { color:var(--accent); background:var(--panel2); }
  .sep { width:1px; height:18px; background:var(--line); margin:0 4px; flex:none; }
  .hint { color:var(--muted); font-size:11px; margin:4px 0; }
  .hint code { color:#bbb; }

  /* top bar */
  header { display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  .logo { display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px; }
  .logo i { width:18px; height:18px; border-radius:4px; background:var(--accent); display:inline-block; }
  .pname { color:var(--muted); padding-left:10px; border-left:1px solid var(--line); cursor:text; }
  #status { flex:1; text-align:center; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status a { color:var(--accent); }
  #export { padding:4px 16px; }

  /* 3-column work area */
  .work { display:grid; grid-template-columns:336px 1fr 300px; min-height:0; }
  #bin { display:grid; grid-template-columns:56px 1fr; min-height:0; border-right:1px solid var(--line); background:var(--panel); }
  #tabs { border-right:1px solid var(--line); display:flex; flex-direction:column; padding:4px 0; overflow:auto; }
  #tabs button { background:none; border:0; border-radius:0; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 7px; font-size:10px; }
  #tabs button:hover { color:var(--fg); }
  #tabs button.on { color:var(--fg); } #tabs button.on svg { color:var(--accent); }
  #pane { overflow:auto; padding:10px; min-height:0; }
  .ptool { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .ptool h2 { flex:1; }
  h2 { font-size:12px; font-weight:600; margin:0; color:var(--fg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px 8px; }
  .card { cursor:pointer; min-width:0; }
  .card .th { position:relative; aspect-ratio:16/9; background:#121215; border-radius:4px; overflow:hidden; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:#555; }
  .card:hover .th { border-color:#4a4a55; } .card.on .th { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .card img { width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0; }
  .card img[src=""] { display:none; }
  .card .dur { position:absolute; left:4px; bottom:4px; font-size:10px; background:rgba(0,0,0,.65); padding:0 4px; border-radius:2px; color:#fff; }
  .card .acts { position:absolute; right:3px; bottom:3px; display:flex; gap:2px; opacity:0; transition:opacity .12s; }
  .card:hover .acts { opacity:1; }
  .card .acts button, .card .acts a { width:22px; height:22px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:rgba(0,0,0,.75); border:0; border-radius:3px; color:#fff; }
  .card .acts button:hover { background:var(--accent); color:#062b28; }
  .card .nm { font-size:11px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#cfcfd4; }
  .card .sw { width:100%; height:100%; background:linear-gradient(135deg, #e3b07a, #4f8fd8 55%, #2d3f6e); } /* sample image the look is applied to */
  .card .tx { font-size:11px; text-align:center; padding:4px; color:#ddd; }
  .tiles .card .th { aspect-ratio:2.4; }
  .card .tx.big { font:700 18px Impact, "Arial Black", sans-serif; -webkit-text-stroke:.5px #000; color:#fff; }
  .list .card { display:flex; align-items:center; gap:8px; padding:6px; border-radius:4px; }
  .list .card:hover { background:var(--panel2); }
  .list .card .th { width:34px; height:34px; aspect-ratio:auto; flex:none; border-radius:50%; background:#2c2c34; color:#aaa; }
  .list .card .nm { margin:0; flex:1; }
  .list .card small { color:var(--muted); }
  .list .card .acts { position:static; opacity:1; }

  /* player */
  #stage { display:grid; grid-template-rows:28px 1fr 38px; background:var(--bg); min-height:0; }
  .ptitle { font-size:12px; color:var(--muted); padding:0 12px; display:flex; align-items:center; border-bottom:1px solid var(--line); }
  .pbox { display:flex; align-items:center; justify-content:center; background:#0e0e11; min-height:0; padding:10px; }
  #preview { max-width:100%; max-height:100%; background:#000; touch-action:none; }
  .transport { display:flex; align-items:center; gap:6px; padding:0 10px; border-top:1px solid var(--line); }
  #time { font-variant-numeric:tabular-nums; font-size:12px; margin-left:4px; }
  #time span { color:var(--muted); }
  .transport .grow { flex:1; }

  /* inspector */
  #insp { display:grid; grid-template-rows:34px 1fr; min-height:0; border-left:1px solid var(--line); background:var(--panel); }
  .itabs { display:flex; border-bottom:1px solid var(--line); padding:0 4px; overflow:auto; }
  .itabs button { background:none; border:0; border-bottom:2px solid transparent; border-radius:0; color:var(--muted); padding:0 10px; height:34px; white-space:nowrap; }
  .itabs button:hover { color:var(--fg); background:none; }
  .itabs button.on { color:var(--fg); border-bottom-color:var(--accent); }
  .ibody { overflow:auto; padding:8px 12px 20px; }
  .sec { padding:6px 0 8px; border-bottom:1px solid var(--line); }
  .sec:last-child { border-bottom:0; }
  .sec h3 { font-size:12px; font-weight:600; margin:4px 0 6px; color:var(--fg); display:flex; align-items:center; gap:6px; }
  .sec h3 small { color:var(--muted); font-weight:400; }
  .prop { display:grid; grid-template-columns:74px 1fr 56px 18px; align-items:center; gap:6px; margin:3px 0; color:var(--muted); }
  .prop.nokf { grid-template-columns:74px 1fr 56px; }
  .prop input[type=number] { width:56px; padding:2px 4px; text-align:right; font-size:11px; }
  .prop select { width:100%; }
  .prop .kf { width:18px; height:18px; padding:0; border:0; background:none; color:#5a5a64; display:inline-flex; align-items:center; justify-content:center; }
  .prop .kf svg { width:11px; height:11px; }
  .prop .kf:hover { color:#fff; background:none; } .prop .kf.some { color:#d0d0d6; } .prop .kf.on { color:var(--accent); }
  .field { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:5px 0; color:var(--muted); }
  .field > :last-child { color:var(--fg); }
  .btns { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
  .btns button { font-size:11px; padding:3px 8px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:none; padding:3px 10px; }
  .seg button.on { background:var(--panel2); color:var(--accent); }
  .pre { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin:6px 0; }
  .pre button { padding:4px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; }
  .pre button.on { border-color:var(--accent); color:var(--accent); }
  .pre svg { width:100%; height:26px; }
  #words { max-height:200px; overflow:auto; background:#1a1a1e; border-radius:4px; padding:6px; line-height:1.9; }
  #words i { font-style:normal; padding:1px 2px; border-radius:3px; cursor:pointer; }
  #words i:hover { background:var(--panel2); }
  #words i.on { background:#b33a4d; text-decoration:line-through; }
  #words i.filler { color:#f0b35a; }
  .kflist div { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:2px 0; color:var(--muted); font-variant-numeric:tabular-nums; }
  .kflist b { color:var(--fg); font-weight:500; }

  /* timeline */
  footer { background:var(--panel); border-top:1px solid var(--line); display:grid; grid-template-rows:34px 1fr; min-height:0; }
  .tlbar { display:flex; gap:3px; align-items:center; padding:0 8px; border-bottom:1px solid var(--line); }
  .tlbar select, .tlbar input[type=text] { padding:2px 6px; height:24px; }
  .tlbar label { color:var(--muted); display:flex; align-items:center; gap:4px; }
  #zoom { width:90px; }
  #tl { overflow:auto; position:relative; background:var(--bg); }
  #inner { position:relative; min-height:100%; }
  .row { display:flex; align-items:stretch; margin:0 0 4px; }
  .row.ruler { margin:0; }
  .head { position:sticky; left:0; z-index:7; width:var(--head); flex:none; background:var(--panel); border-right:1px solid var(--line);
          display:flex; align-items:center; gap:1px; padding:0 4px 0 8px; font-size:11px; color:var(--muted); }
  .head b { flex:1; font-weight:500; color:#c9c9cf; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .head .ib { width:20px; height:20px; color:#6d6d77; } .head .ib svg { width:13px; height:13px; } .head .ib.on { color:var(--accent); background:none; }
  #ruler { position:relative; height:24px; flex:1; border-bottom:1px solid var(--line); cursor:col-resize; }
  #ruler i { position:absolute; top:0; height:100%; border-left:1px solid #3a3a42; padding-left:4px; font-size:10px; color:var(--muted); font-style:normal; line-height:12px; }
  #ruler i::after { content:''; position:absolute; left:50%; bottom:0; height:4px; border-left:1px solid #3a3a42; }
  .track { position:relative; flex:1; height:56px; background:rgba(255,255,255,.025); }
  .row.small .track { height:28px; } .row.mid .track { height:40px; }
  .clip { position:absolute; top:0; height:100%; border-radius:4px; background:#2b2b33; border:1px solid #3d3d47; overflow:hidden; cursor:grab;
          user-select:none; touch-action:none; }
  .clip.video, .clip.overlay { background-color:#26262d; background-repeat:repeat-x; background-size:auto 100%; background-position:left center; }
  .clip.audio { background-color:var(--aclip); background-repeat:no-repeat; }
  .clip.text { background:var(--tclip); border-color:#a2772a; }
  .clip.sel { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .clip span { position:absolute; left:0; right:0; top:0; height:16px; line-height:16px; padding:0 6px; font-size:10px; white-space:nowrap; overflow:hidden;
               text-overflow:ellipsis; pointer-events:none; background:rgba(0,0,0,.55); color:#eee; }
  .clip.text span { background:none; height:100%; line-height:26px; font-size:11px; }
  .clip b { font-weight:500; color:var(--accent); margin-left:5px; }
  .clip small { position:absolute; right:5px; bottom:2px; font-size:10px; color:#ddd; text-shadow:0 0 2px #000; pointer-events:none; }
  .h { position:absolute; top:0; width:7px; height:100%; cursor:ew-resize; background:var(--accent); opacity:0; }
  .h::after { content:''; position:absolute; left:2.5px; top:30%; height:40%; width:2px; background:#062b28; border-radius:1px; }
  .h.l { left:0; } .h.r { right:0; }
  .clip.sel .h { opacity:1; }
  .joint { position:absolute; top:50%; margin:-9px 0 0 -9px; width:18px; height:18px; padding:0; border-radius:3px; z-index:3; background:#3a3a44; border:1px solid #50505c;
           color:#d0d0d6; display:flex; align-items:center; justify-content:center; }
  .joint svg { width:10px; height:10px; }
  .joint.on { background:var(--accent); color:#062b28; border-color:var(--accent); }
  .joint.sel { outline:1px solid #fff; }
  .clip .kfm { position:absolute; bottom:3px; width:7px; height:7px; background:#fff; border:1px solid #000; transform:translateX(-50%) rotate(45deg); z-index:2; pointer-events:none; }
  .clip .cur { position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--accent); opacity:.8; pointer-events:none; }
  #playhead { position:absolute; top:0; bottom:0; width:1px; background:#fff; z-index:6; pointer-events:none; }
  #playhead::before { content:''; position:absolute; top:0; left:-5px; width:11px; height:13px; background:#fff; clip-path:polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); }
  #beats { position:absolute; left:var(--head); right:0; top:24px; bottom:0; pointer-events:none; z-index:1; }
  #beats i { position:absolute; top:0; bottom:0; border-left:1px dashed rgba(0,209,193,.22); }
  #beats i.strong { border-left:1px solid rgba(0,209,193,.5); }
  body.nobeats #beats { display:none; }
  @keyframes flash { 0% { box-shadow:0 0 0 2px var(--accent); filter:brightness(1.7); } 100% { box-shadow:none; filter:none; } }
  .clip.flash { animation:flash 1.2s ease-out; }

  /* agent toast (Claude / CLI edits project.json) */
  #agent { position:fixed; right:16px; bottom:16px; background:#2a2a31; border:1px solid var(--line); border-left:3px solid var(--accent); color:var(--fg);
           padding:8px 12px; border-radius:4px; font-size:12px; z-index:20; opacity:0; transition:opacity .25s; pointer-events:none; max-width:420px; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  #agent.on { opacity:1; }
  @media (max-width:1100px) { .work { grid-template-columns:280px 1fr 260px; } }
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>Luminar Videos</div>
  <span class="pname" id="pname" title="Click to rename">Untitled project</span>
  <span id="status">Loading…</span>
  <button class="primary" id="export">Export</button>
</header>

<div class="work">
  <aside id="bin">
    <nav id="tabs"></nav>
    <div id="pane"></div>
  </aside>
  <section id="stage">
    <div class="ptitle">Player</div>
    <div class="pbox"><canvas id="preview" width="960" height="540"></canvas></div>
    <div class="transport">
      <button class="ib" id="play" title="Play/Pause (Space)"></button>
      <span id="time"></span>
      <span class="grow"></span>
      <select id="canvas" title="Canvas ratio">
        <option value="">Original</option>
        <option value="[1080,1920]">9:16</option>
        <option value="[1920,1080]">16:9</option>
        <option value="[1080,1080]">1:1</option>
        <option value="[1080,1350]">4:5</option>
      </select>
      <button class="ib" id="fs" title="Fullscreen"></button>
    </div>
  </section>
  <aside id="insp"><div class="itabs"></div><div class="ibody"></div></aside>
</div>

<footer>
  <div class="tlbar">
    <button class="ib" id="undo" title="Undo (Ctrl+Z)"></button>
    <button class="ib" id="redo" title="Redo (Ctrl+Y)"></button>
    <span class="sep"></span>
    <button class="ib" id="split" title="Split at playhead (S)"></button>
    <button class="ib" id="tdel" title="Delete (Del)"></button>
    <button class="ib" id="tfreeze" title="Freeze frame (F)"></button>
    <button class="ib" id="tmirror" title="Mirror"></button>
    <button class="ib" id="trot" title="Rotate 90°"></button>
    <span class="sep"></span>
    <select id="style" title="Edit style"><option value="auto">Style: auto</option><option value="ironic">ironic (hook → drop)</option><option value="phonk">phonk</option><option value="velocity">velocity</option><option value="aura">aura</option><option value="montage">montage</option><option value="trending">trending (TikTok template)</option></select>
    <input type="text" id="hooktext" placeholder="text pops, e.g. UNSER EUROPA" style="width:12em">
    <button class="ghost" id="makeedit" title="Fully automatic edit: first main-track clip = hook, song = first audio in the bin or the audio track. Watch it being built.">Auto edit</button>
    <button id="autoedit" title="Cut the main-track clips to the beat of the audio-track song (TikTok beat sync)">Auto beat edit</button>
    <label title="Cut every N-th beat">every <input type="number" id="every" value="2" min="1" max="16" style="width:3em"></label>
    <span style="flex:1"></span>
    <button class="ib on" id="beatsToggle" title="Show beat markers"></button>
    <button class="ib on" id="snapBtn" title="Snap to beats"></button>
    <span class="sep"></span>
    <input type="range" id="zoom" min="10" max="300" value="80" title="Timeline zoom">
  </div>
  <div id="tl"><div id="inner">
    <div class="row ruler"><div class="head"></div><div id="ruler"></div></div>
    <div class="row small"><div class="head" data-track="text"><b>Text</b></div><div class="track" id="track-text"></div></div>
    <div class="row mid"><div class="head" data-track="overlay"><b>Overlay</b></div><div class="track" id="track-overlay"></div></div>
    <div class="row"><div class="head" data-track="video"><b>Main</b></div><div class="track" id="track-video"></div></div>
    <div class="row mid"><div class="head" data-track="audio"><b>Audio</b></div><div class="track" id="track-audio"></div></div>
    <div id="beats"></div>
    <div id="playhead"></div>
  </div></div>
</footer>
<div id="agent"></div>
<input type="file" id="file" multiple accept="video/*,audio/*,image/*" hidden>

<script type="module">
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10).padEnd(8, '0');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60); return `${m}:${(t - m * 60).toFixed(2).padStart(5, '0')}`; };
const tc = t => { t = Math.max(0, t); const f = Math.floor((t % 1) * P.fps), s = Math.floor(t) % 60, m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600);
  return [h, m, s, f].map(n => String(n).padStart(2, '0')).join(':'); };   // CapCut time code hh:mm:ss:ff
const mediaURL = name => '/media/' + encodeURIComponent(name);
const status = html => $('#status').innerHTML = html;
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j?.error || r.status);
  return j;
}
async function busy(label, fn) {
  status(esc(label) + '…'); document.body.classList.add('busy');
  try { const r = await fn(); if ($('#status').textContent.startsWith(label)) status(esc(label) + ' ✓'); return r; }
  catch (e) { status(esc(label) + ' failed: ' + esc(e.message)); console.error(e); }
  finally { document.body.classList.remove('busy'); }
}

// ---------- icons (inline SVG line icons like CapCut; no emoji) ----------
const I = d => `<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  media: I('<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4.5 2.5v11M11.5 2.5v11M1.5 6h3M1.5 10h3M11.5 6h3M11.5 10h3"/>'),
  audio: I('<path d="M6 13V4l7-2v9"/><circle cx="4" cy="13" r="2"/><circle cx="11" cy="11" r="2"/>'),
  text: I('<path d="M3 3.5h10M8 3.5v9M5.5 12.5h5"/>'),
  sticker: I('<path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5V9l-5 5H3.5A1.5 1.5 0 0 1 2 12.5z"/><path d="M14 9H9v5"/>'),
  effects: I('<path d="M8 1.5l1.7 4.3L14 7.5l-4.3 1.7L8 13.5 6.3 9.2 2 7.5l4.3-1.7z"/>'),
  transitions: I('<path d="M1.5 4h6v8h-6zM8.5 4h6v8h-6z"/><path d="M5.5 8h5"/>'),

function applyKey(it, k, v, t) {   // one inspector field -> model
  const max = M(it.media).dur || Infinity;
  if (k in KF_DEF && sel.kind !== 'text') return applyProp(sel.kind, it, k, +v);
  if (k.startsWith('mask.')) {
    const f = k.slice(5);
    if (f === 'type') { if (v === 'none') delete it.mask; else it.mask = { type: v, x: .5, y: .5, w: .5, h: .5, feather: 0.05, ...(it.mask || {}), type: v }; return; }
    it.mask ??= { type: 'rect', x: .5, y: .5, w: .5, h: .5, feather: 0.05 }; it.mask[f] = f === 'invert' ? !!v : +v; return;
  }
  if (k.startsWith('adjust.')) { it.adjust = { ...(it.adjust || {}) }; it.adjust[k.slice(7)] = clamp(+v, -1, 1); return; }
  if (k.startsWith('crop.')) { it.crop = { x: 0, y: 0, w: 1, h: 1, ...(it.crop || {}) }; it.crop[k.slice(5)] = clamp(+v, 0, 1); return; }
  if (k.startsWith('chroma.')) {
    const f = k.slice(7), c = { color: '#00ff00', similarity: 0.3, blend: 0.1, ...(it.chroma || {}) };
    if (f === 'on') { if (t?.checked) it.chroma = c; else delete it.chroma; return; }
    c[f] = f === 'color' ? v : +v; if (it.chroma || f === 'color') it.chroma = c; return;
  }
  if (k === 'effect') { if (v) it.effect = v; else delete it.effect; return; }
  if (k === 'stab' || k === 'denoise' || k === 'shadow') { it[k] = !!(t ? t.checked : v); return; }
  if (k === 'pitch') { it.pitch = clamp(Math.round(+v), -12, 12); return; }
  if (k === 'boxcolor') { it.boxcolor = v; return; }
  if (k === 'hl') { if (String(v).trim()) it.hl = String(v).trim(); else delete it.hl; return; }
  if (k === 'hlcolor') { it.hlcolor = v; return; }
  if (k === 'hlscale') { it.hlscale = clamp(+v || HL_SCALE, 1, 2); return; }
  if (k.startsWith('sticker.')) {
    const f = k.slice(8), st = { media: '', word: '', ...(it.sticker || {}) };
    st[f] = f === 'media' || f === 'word' ? String(v) : +v;
    if (st.media && st.word) it.sticker = st; else if (!st.media && !st.word) delete it.sticker; else it.sticker = st; return;
  }
  if (k.startsWith('eye_fx.')) {
    const f = k.slice(7); it.eye_fx = { ...(it.eye_fx || {}) };
    it.eye_fx[f] = f === 'color' ? v : f === 'beam' ? !!(t ? t.checked : v) : +v; return;
  }
  if (k.startsWith('anim_in.') || k.startsWith('anim_out.')) {
    const [a, f] = k.split('.');
    if (f === 'type') { if (v === 'none') delete it[a]; else it[a] = { dur: 0.4, ...(it[a] || {}), type: v }; return; }
    it[a] ??= { type: 'fade', dur: 0.4 }; it[a].dur = Math.max(0.05, +v); return;
  }
  if (k === 'curvePts') { const pts = String(v).split(/[\s,;]+/).map(p => p.split(':').map(Number)).filter(p => p.length === 2 && p.every(Number.isFinite)).map(([t, s]) => ({ t: clamp(t, 0, 1), speed: clamp(s, 0.05, 20) }));
    if (pts.length > 1) it.speedCurve = pts; return; }
  v = (t?.type === 'checkbox') ? t.checked : (t?.type === 'color' || t?.type === 'text' || t?.tagName === 'SELECT') ? v : +v;
  if (k === 'in') it.in = clamp(v, 0, it.out - 0.05);
  else if (k === 'out') it.out = clamp(v, it.in + 0.05, max);
  else if (k === 'speed') it.speed = clamp(v || 1, 0.1, 10);
  else if (k === 'volume') it.volume = clamp(v, 0, 4);
  else if (k === 'rotation') it.rotation = ((v % 360) + 360) % 360;
  else if (k === 'start') it.start = Math.max(0, v);
  else if (k === 'dur') it.dur = Math.max(0.1, v);
  else if (k === 'scale') it.scale = clamp(v, 0.05, 3);
  else if (k === 'size') it.size = clamp(v, 0.01, 0.5);
  else if (k === 'x' || k === 'y') it[k] = clamp(v, 0, 1);
  else if (k === 'fadeIn' || k === 'fadeOut') it[k] = Math.max(0, v);
  else if (k === 'reverse' || k === 'box') it[k] = !!v;
  else if (k === 'color') it.color = v;
  else if (k === 'font') it.font = v;
  else if (k === 'filter') it.filter = v;
  else if (k === 'zoom') it.zoom = clamp(v || 1, 1, 3);
  else if (k === 'zoomTo') { if (v > 0) it.zoomTo = clamp(v, 1, 3); else delete it.zoomTo; }
  else if (k === 'shake') it.shake = clamp(v, 0, 1);
}

async function detectBeats(kind, it) {
  return busy('Detecting beats', async () => {
    if (!M(it.media).audio) throw new Error('no audio in this clip');
    const g = await api('/api/beats', { media: it.media });
    const x = kind === 'video' ? layout().find(x => x.s === it) : it, sp = it.speed || 1;
    const toTl = b => b >= it.in && b <= it.out ? +(x.start + (b - it.in) / sp).toFixed(3) : null;
    edit(() => { P.bpm = g.bpm; P.beats = g.beats.map(toTl).filter(b => b !== null); P.strong = g.strong.map(toTl).filter(b => b !== null); });
    status(`${P.beats.length} beats · ${g.bpm} BPM`);
  });
}
const deleteSel = () => { const it = selected(); if (!it) return; const L = list(sel.kind); edit(() => L.splice(L.indexOf(it), 1)); };

async function doAct(act) {
  const it = selected();
  if (act === 'trall') {
    const tr = P.video[sel.i]?.transition;
    return edit(() => P.video.slice(0, -1).forEach(s => s.transition = { ...tr }));
  }
  if (!it) return status('Select a clip first.');
  const L = list(sel.kind), i = L.indexOf(it);
  if (act.startsWith('curve:')) return edit(() => { const c = CURVES[act.slice(6)]; it.speedCurve = c.map((s, k, a) => ({ t: +(k / (a.length - 1)).toFixed(3), speed: s })); });
  if (act.startsWith('kfGo:')) { T = itemStart(sel.kind, it) + it.keyframes[+act.slice(5)].t; return drawInspector(); }
  if (act.startsWith('kfDel:')) return edit(() => { it.keyframes.splice(+act.slice(6), 1); if (!it.keyframes.length) delete it.keyframes; });
  switch (act) {
    case 'del': return edit(() => L.splice(i, 1));
    case 'rotL': return edit(() => it.rotation = ((it.rotation || 0) + 270) % 360);
    case 'rotR': return edit(() => it.rotation = ((it.rotation || 0) + 90) % 360);
    case 'flip': return edit(() => it.flip = !it.flip);
    case 'rotAll': return edit(() => P.video.forEach(s => { s.rotation = it.rotation; s.flip = it.flip; }));
    case 'mute': return edit(() => it.volume = it.volume === 0 ? 1 : 0);
    case 'eyesOff': return edit(() => { delete it.eyes; delete it.eye_fx; });
    case 'adjReset': return edit(() => { delete it.adjust; });
    case 'split': return splitAt(T);
    case 'freeze': return freezeAt(T);
    case 'kfClear': return edit(() => delete it.keyframes);
    case 'speedNormal': return edit(() => { delete it.speedCurve; });
    case 'speedCurve': return edit(() => { it.speedCurve = CURVES.montage.map((s, k, a) => ({ t: +(k / (a.length - 1)).toFixed(3), speed: s })); });
    case 'dup': return edit(() => { const d = { ...structuredClone(it), id: uid() }; if (sel.kind !== 'video') d.start += itemLen(sel.kind, it); L.splice(i + 1, 0, d); sel = { kind: sel.kind, id: d.id }; });
    case 'left': if (i > 0) edit(() => L.splice(i - 1, 0, ...L.splice(i, 1))); return;
    case 'right': if (i < L.length - 1) edit(() => L.splice(i + 1, 0, ...L.splice(i, 1))); return;
    case 'toOverlay': return edit(() => {
      const x = layout().find(x => x.s === it);
      P.video.splice(i, 1);
      const o = { id: it.id, media: it.media, start: x.start, in: it.in, out: it.out, speed: it.speed || 1, volume: it.volume ?? 1,
                  rotation: it.rotation || 0, flip: !!it.flip, x: 0.5, y: 0.5, scale: 0.5, keyframes: it.keyframes };
      P.overlay.push(o); sel = { kind: 'overlay', id: o.id };
    });
    case 'extract': return busy('Extracting audio', async () => {
      if (!M(it.media).audio) throw new Error('clip has no audio');
      if (it.reverse) throw new Error('turn off reverse first');
      const a = await api('/api/extract-audio', { media: it.media });
      await refreshMedia();
      const x = layout().find(x => x.s === it);
      // CapCut "extract audio": audio moves to its own track, the clip is muted
      edit(() => { P.audio.push({ id: uid(), media: a.name, start: x.start, in: it.in, out: it.out, speed: it.speed || 1, volume: it.volume ?? 1,

    case 'combine': return busy('Combining', async () => {

      const next = P.video[i + 1];
      if (!next) throw new Error('no clip after this one');
      const [W, H] = canvasSize();
      const out = await api('/api/render', { compound: true, canvas: [W, H], fps: P.fps,
                                             video: [{ ...it }, { ...next, transition: { type: 'none', dur: 0 } }] });
      await refreshMedia();
      edit(() => P.video.splice(i, 2, newSeg(out, { id: it.id, transition: next.transition })));
    });
    case 'beats': case 'beatsHere': return detectBeats(sel.kind, it);
    case 'beatCut': {
      if (!P.beats?.length) return status('No beat markers yet.');
      if (it.freeze || it.reverse || hasCurve(it)) return status('Not for freeze/reversed/curve clips.');
      const x = layout().find(x => x.s === it), every = Math.max(1, +$('#every').value || 1);
      const cuts = P.beats.filter((b, k) => k % every === 0 && b > x.start + 0.1 && b < x.start + x.len - 0.1).map(b => srcTime(it, b - x.start));
      if (!cuts.length) return status('No beats inside this clip.');
      const b = [it.in, ...cuts, it.out];
      return replaceWithPieces(it, b.slice(0, -1).map((a, k) => [a, b[k + 1]]));
    }
    case 'scenes': return busy('Detecting scenes', async () => {

        .filter(c => c > it.in + 0.1 && c < it.out - 0.1);

      const b = [it.in, ...cuts, it.out];

    });
    case 'transcribe': return busy('Transcribing', async () => {
      status('Transcribing… (first run loads the speech model, long clips take a while)');
      await getTranscript(it.media);
      status('Transcribing ✓'); drawInspector();
    });
    case 'cutWords': {
      const ws = clipWords(it).filter(w => wordSel.has(w.i));
      if (!ws.length) return status('Click some words first.');

      return replaceWithPieces(it, cutRanges(it, wordRanges(ws), false));
    }
    case 'fillers': {
      const ws = clipWords(it).filter(w => FILLERS.has(bare(w.w)));
      if (!ws.length) return status('No filler words found.');

    }
    case 'searchDel': case 'searchKeep': {
      const q = $('#q').value.trim();
      if (!q) return status('Type something to search for.');
      const ws = phraseHits(clipWords(it), q);
      if (!ws.length) return status(`Nothing matches “${esc(q)}”.`);

      const mode = $('#bgmode').value, imgFile = $('#bgimg').files[0];

      if (it.freeze || it.reverse) throw new Error('not for freeze/reversed clips');

      setPlaying(false);

      await refreshMedia();

  }
  const kf = e.target.closest('[data-kf]');
  if (kf) { const it = selected(); if (it) edit(() => toggleKey(sel.kind, it, kf.dataset.kf)); return; }
  const act = e.target.closest('[data-act]')?.dataset.act; if (act) doAct(act);
});

// ---------- media bin ----------
async function refreshMedia() {
  media = await api('/api/media');
  if (binTab === 'media' || binTab === 'audio' || binTab === 'sticker') drawPane();
  (async () => { for (const m of media) if (m.video) await thumb(m.name); })();   // thumbnails trickle in, UI stays responsive
}
async function upload(files) {
  for (const f of files) {
    await busy(`Importing ${f.name}`, async () => {
      const r = await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
    });
  }
  await refreshMedia();
}
$('#file').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) upload([...e.dataTransfer.files]); });

// ---------- top bar / toolbar / keys ----------
$('#play').onclick = () => setPlaying(!playing);
$('#split').onclick = () => splitAt(T);
$('#tdel').onclick = deleteSel;
$('#tfreeze').onclick = () => freezeAt(T);
$('#tmirror').onclick = () => doAct('flip');
$('#trot').onclick = () => doAct('rotR');
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#zoom').oninput = e => { zoom = +e.target.value; drawTimeline(); };
$('#snapBtn').onclick = e => { snapOn = !snapOn; e.currentTarget.classList.toggle('on', snapOn); };
$('#beatsToggle').onclick = e => { const on = document.body.classList.toggle('nobeats'); e.currentTarget.classList.toggle('on', !on); };
$('#canvas').onchange = e => edit(() => P.canvas = e.target.value ? JSON.parse(e.target.value) : null);
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('#stage').requestFullscreen();
$('#pname').onclick = () => { const n = prompt('Project name', P.name || ''); if (n !== null) edit(() => P.name = n.trim()); };
$('#makeedit').onclick = () => busy('Auto edit', async () => {
  const song = P.audio[0]?.media || media.find(m => !m.video && m.audio)?.name;
  if (!song) throw new Error('add a song: drop an mp3 into the media bin (or put it on the audio track)');
  const clips = [...new Set(P.video.filter(s => !s.freeze).map(s => s.media))];
  const list = clips.length ? clips : media.filter(m => m.video && m.name !== song && !/^(export|compound)_/.test(m.name)).map(m => m.name);
  if (!list.length) throw new Error('no clips: import some videos');
  const r = await api('/api/tiktok', { song, clips: list, style: $('#style').value, text: $('#hooktext').value.trim(), pace: 0.7 });
  status(`Building the edit in ${r.steps} steps… watch the timeline.`);
});
$('#autoedit').onclick = () => busy('Auto beat edit', async () => {
  const song = P.audio[0];
  if (!song) throw new Error('add a song to the audio track first (Audio tab)');
  const clips = [...new Set(P.video.filter(s => !s.freeze).map(s => s.media))];
  if (!clips.length) throw new Error('add the clips to the main track first; they are cut round-robin to the beat');
  const r = await api('/api/autoedit', { song: song.media, clips, every: Math.max(1, +$('#every').value || 2) });
  edit(() => { P.video = r.video; P.audio = [{ ...song, ...r.audio[0], id: song.id }]; P.beats = r.beats; P.bpm = r.bpm; P.strong = []; sel = null; });
  status(`${r.video.length} beat-synced slices.`);
});
$('#export').onclick = () => busy('Rendering', async () => {
  if (!P.video.length) throw new Error('timeline is empty');
  setPlaying(false);
  const out = await api('/api/render', P);
  await refreshMedia();
  status(`Exported <a href="${mediaURL(out.name)}" download>${esc(out.name)}</a> · ${fmt(out.dur)}`);
});
addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  const ctrl = e.ctrlKey || e.metaKey;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (e.key.toLowerCase() === 's' && !ctrl) splitAt(T);
  else if (e.key.toLowerCase() === 'f' && !ctrl) freezeAt(T);
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selected()) deleteSel();
  else if (e.key === 'ArrowLeft') T = Math.max(0, T - 1 / P.fps);
  else if (e.key === 'ArrowRight') T = Math.min(total(), T + 1 / P.fps);
});

// ---------- boot ----------
const saved = await api('/api/project').catch(() => null);
if (saved?.project?.video) { P = { ...P, ...saved.project }; projMtime = saved.mtime; }
$('#canvas').value = P.canvas ? JSON.stringify(P.canvas) : '';
setPlaying(false);
const q = new URLSearchParams(location.search);   // dev/screenshot hook: ?sel=0&tab=video&bin=effects&t=2.5 selects main clip 0 etc.
if (q.has('sel')) { const s = P.video[+q.get('sel')]; if (s) sel = { kind: 'video', id: s.id }; }
if (q.has('tab')) inspTab = q.get('tab');
if (q.has('bin')) { binTab = q.get('bin'); $('#tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.tab === binTab)); }
if (q.has('t')) T = +q.get('t') || 0;
drawPane(); changed();
requestAnimationFrame(tick);
await refreshMedia();
status(media.length ? 'Ready.' : 'Import some clips to start.');
</script>
</body>
</html>
